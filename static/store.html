<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מכירה בחנות 🏬</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #064e3b; color: #fff; padding: 16px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 24px; color: #6ee7b7; margin-bottom: 4px; }
        .header p { color: #a7f3d0; font-size: 14px; }
        .section-title { font-size: 14px; color: #a7f3d0; margin: 12px 0 6px 0; font-weight: 600; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-action {
            background: #047857; border: 2px solid #059669; border-radius: 10px; padding: 12px 4px;
            color: #fff; text-align: center; font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .btn-action.active { background: #10b981; border-color: #6ee7b7; }
        .input-box { background: #065f46; border: 2px solid #059669; border-radius: 10px; padding: 8px; text-align: center; }
        .input-box label { font-size: 11px; color: #a7f3d0; display: block; margin-bottom: 2px; }
        .input-box input {
            width: 100%; background: transparent; border: none; color: #6ee7b7; font-size: 18px;
            font-weight: bold; outline: none; text-align: center;
        }
        .profit-card {
            background: rgba(16, 185, 129, 0.15); border: 1px solid #34d399; border-radius: 12px;
            padding: 10px; margin-top: 14px; display: flex; justify-content: space-around; align-items: center;
        }
        .profit-label { font-size: 13px; color: #a7f3d0; }
        .profit-val { font-size: 22px; font-weight: 900; color: #6ee7b7; }
        .btn-submit {
            background: #f59e0b; border: none; border-radius: 12px; padding: 16px; width: 100%;
            color: #000; font-size: 19px; font-weight: 900; margin-top: 16px; cursor: pointer;
        }
        .btn-submit:active { transform: scale(0.97); background: #d97706; }
        #toast {
            visibility: hidden; min-width: 260px; background-color: #10b981; color: #fff;
            text-align: center; border-radius: 10px; padding: 14px; position: fixed;
            z-index: 100; bottom: 25px; font-size: 16px; font-weight: bold;
        }
        #toast.show { visibility: visible; animation: pop 0.4s, fadeout 0.4s 2.2s; }
        @keyframes pop { from { bottom: 0; opacity: 0; } to { bottom: 25px; opacity: 1; } }
        @keyframes fadeout { from { bottom: 25px; opacity: 1; } to { bottom: 0; opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏬 מכירה בקופה (אלנבי)</h1>
            <p>בחר פריט, וודא מחירים ושמור</p>
        </div>

        <div class="section-title">1. בחר פריט שנמכר:</div>
        <div class="grid-3">
            <button class="btn-action active" onclick="selectItem('מזוודה קטנה 20', 'בודדת 20', 100, 150, this)">🧳 קטנה 20"</button>
            <button class="btn-action" onclick="selectItem('מזוודה בינונית 24', 'בודדת 24', 120, 200, this)">🧳 בינונית 24"</button>
            <button class="btn-action" onclick="selectItem('מזוודה גדולה 28', 'בודדת 28', 140, 250, this)">🧳 גדולה 28"</button>
            <button class="btn-action" onclick="selectItem('מזוודה ענקית 32', 'בודדת 32', 170, 300, this)">🧳 ענקית 32"</button>
            <button class="btn-action" onclick="selectItem('סט מזוודות בחנות', 'סט', 250, 600, this)">📦 סט שלם</button>
            <button class="btn-action" onclick="selectItem('תיק / פריט אחר', 'אחר', 50, 100, this)">🎒 תיק / אחר</button>
        </div>

        <div class="section-title">2. מחיר מכירה ועלות קנייה:</div>
        <div class="grid-2">
            <div class="input-box">
                <label>מחיר מכירה ללקוח (₪)</label>
                <input type="number" id="storeSalePrice" value="150" oninput="calculateStoreProfit()">
            </div>
            <div class="input-box">
                <label>עלות קנייה מהספק (₪)</label>
                <input type="number" id="storeCostPrice" value="100" oninput="calculateStoreProfit()">
            </div>
        </div>

        <div class="profit-card">
            <div class="profit-label">רווח נקי מהעסקה:</div>
            <div class="profit-val" id="storeProfitDisplay">50 ₪</div>
        </div>

        <button class="btn-submit" onclick="submitStoreSale()">💾 שמור מכירה בקופה</button>
    </div>

    <div id="toast">✅ המכירה בחנות נרשמה!</div>

    <script>
        let currentItem = { name: 'מזוודה קטנה 20', category: 'בודדת 20' };

        function selectItem(name, category, defaultCost, defaultSale, elem) {
            document.querySelectorAll('.grid-3 .btn-action').forEach(b => b.classList.remove('active'));
            elem.classList.add('active');
            currentItem = { name, category };
            document.getElementById('storeCostPrice').value = defaultCost;
            document.getElementById('storeSalePrice').value = defaultSale;
            calculateStoreProfit();
        }

        function calculateStoreProfit() {
            const sale = parseFloat(document.getElementById('storeSalePrice').value) || 0;
            const cost = parseFloat(document.getElementById('storeCostPrice').value) || 0;
            const profit = sale - cost;
            const disp = document.getElementById('storeProfitDisplay');
            disp.innerText = profit + ' ₪';
            disp.style.color = profit >= 0 ? '#6ee7b7' : '#f87171';
        }

        async function submitStoreSale() {
            const salePrice = parseFloat(document.getElementById('storeSalePrice').value) || 0;
            const costPrice = parseFloat(document.getElementById('storeCostPrice').value) || 0;

            try {
                const response = await fetch('/api/sales', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        channel: 'store',
                        item_name: currentItem.name,
                        category: currentItem.category,
                        sale_price: salePrice,
                        cost_price: costPrice,
                        shipping_cost: 0,
                        payment_method: 'in_store',
                        customer_city: 'אלנבי',
                        campaign_tag: 'none'
                    })
                });

                if (response.ok) {
                    showToast("✅ המכירה בחנות נרשמה!");
                } else {
                    alert("שגיאה ברישום המכירה");
                }
            } catch (err) {
                alert("שגיאת תקשורת עם השרת");
            }
        }

        function showToast(msg) {
            const toast = document.getElementById("toast");
            toast.innerText = msg;
            toast.className = "show";
            setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 2500);
        }
        calculateStoreProfit();
    </script>
</body>
</html>
